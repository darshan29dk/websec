<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="gs-shield-grad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gs-core-grad" x1="20" y1="16" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="gs-glow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Crest Glow -->
  <path 
    d="M32 6 L54 14 V28 C54 42.5 44.5 53.8 32 58 C19.5 53.8 10 42.5 10 28 V14 L32 6 Z" 
    fill="url(#gs-shield-grad)" 
    opacity="0.15" 
  />

  <!-- Main Shield Boundary -->
  <path 
    d="M32 8 L52 15.5 V27.5 C52 40.5 43.5 50.8 32 54.8 C20.5 50.8 12 40.5 12 27.5 V15.5 L32 8 Z" 
    fill="#090d16" 
    stroke="url(#gs-shield-grad)" 
    stroke-width="3" 
    stroke-linejoin="round"
  />

  <!-- Inner Defense Grid Lines -->
  <path 
    d="M32 16 V46 M20 31 H44" 
    stroke="#1e293b" 
    stroke-width="2" 
    stroke-dasharray="2 2"
  />

  <!-- Core Emblem: GlobalShield Embedded Diamond & Protection Node -->
  <path 
    d="M32 18 L43 29 L32 44 L21 29 Z" 
    fill="url(#gs-core-grad)" 
    opacity="0.9"
  />

  <!-- Center Security Node -->
  <circle cx="32" cy="29" r="4" fill="#ffffff" />
  <circle cx="32" cy="29" r="7" stroke="url(#gs-shield-grad)" stroke-width="1.5" fill="none" />
</svg>