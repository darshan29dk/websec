server:
  port: ${PORT:${SERVER_PORT:8081}}
  servlet:
    context-path: /

spring:
  application:
    name: globalshield-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.ilsauwdyeizvbbirckwp}
    password: ${SPRING_DATASOURCE_PASSWORD:Dk#5822..com}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      keepalive-time: 15000
      max-lifetime: 45000
      idle-timeout: 25000
      connection-timeout: 8000
      validation-timeout: 2000
      connection-test-query: SELECT 1
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:darshanreddy5822@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 3000
          timeout: 3000
          writetimeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

globalshield:
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:3600000} # 1 hour
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
  lab-mode: ${GLOBALSHIELD_LAB_MODE:${AEGIS_LAB_MODE:true}}
  investigation:
    correlation-window-seconds: ${CORRELATION_WINDOW_SECONDS:300}
  events:
    retention-days: ${EVENTS_RETENTION_DAYS:30}
  ai:
    enabled: ${AI_ENABLED:true}
    provider: ${AI_PROVIDER:mock} # openai, ollama, mock, disabled
    model: ${AI_MODEL:gpt-4o}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    ollama-model: ${OLLAMA_MODEL:llama3}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:2048}
    embedding-provider: ${EMBEDDING_PROVIDER:mock} # mock, openai, ollama
    embedding-model: ${EMBEDDING_MODEL:text-embedding-3-small}
    embedding-dimension: ${EMBEDDING_DIMENSION:1536}

aegis:
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:3600000}
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
  lab-mode: ${GLOBALSHIELD_LAB_MODE:${AEGIS_LAB_MODE:true}}
  investigation:
    correlation-window-seconds: ${CORRELATION_WINDOW_SECONDS:300}
  events:
    retention-days: ${EVENTS_RETENTION_DAYS:30}
  ai:
    enabled: ${AI_ENABLED:true}
    provider: ${AI_PROVIDER:mock}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
